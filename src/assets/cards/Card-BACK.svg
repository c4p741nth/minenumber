<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1288 1848" width="1288" height="1848" role="img" aria-label="card back">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset=".5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".62">
      <stop offset="0" stop-color="#a855f7" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#7c3aed" stop-opacity=".16"/>
      <stop offset="1" stop-color="#0b0b12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset=".5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="88" height="88" patternUnits="userSpaceOnUse">
      <path d="M88 0H0v88" fill="none" stroke="#a78bfa" stroke-opacity=".10" stroke-width="3"/>
    </pattern>
  </defs>

  <!-- neon border + dark body -->
  <rect x="0" y="0" width="1288" height="1848" rx="104" fill="url(#edge)"/>
  <rect x="26" y="26" width="1236" height="1796" rx="84" fill="#0d0d16"/>
  <rect x="26" y="26" width="1236" height="1796" rx="84" fill="url(#grid)"/>
  <rect x="26" y="26" width="1236" height="1796" rx="84" fill="url(#glow)"/>

  <!-- inner hairline frame -->
  <rect x="86" y="86" width="1116" height="1676" rx="58" fill="none" stroke="#c084fc" stroke-opacity=".35" stroke-width="5"/>

  <!-- centre emblem: bomb + spark, echoing the app icon -->
  <g transform="translate(644 852)">
    <circle r="335" fill="none" stroke="url(#ink)" stroke-opacity=".30" stroke-width="8"/>
    <circle r="392" fill="none" stroke="url(#ink)" stroke-opacity=".14" stroke-width="4"/>
    <circle cx="0" cy="46" r="232" fill="#15121f" stroke="url(#ink)" stroke-width="12"/>
    <circle cx="-74" cy="-32" r="60" fill="#ffffff" fill-opacity=".14"/>
    <rect x="86" y="-236" width="74" height="112" rx="26" fill="#15121f" stroke="url(#ink)" stroke-width="12"/>
    <path d="M150 -232 C 214 -300, 176 -352, 232 -404" fill="none" stroke="url(#ink)" stroke-width="16" stroke-linecap="round"/>
    <g fill="#fde047">
      <path d="M232 -472 l26 56 56 26 -56 26 -26 56 -26 -56 -56 -26 56 -26z"/>
      <circle cx="316" cy="-352" r="15" fill-opacity=".85"/>
      <circle cx="160" cy="-486" r="11" fill-opacity=".7"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="644" y="1508" text-anchor="middle" font-family="Geist, Arial, Helvetica, sans-serif"
        font-size="132" font-weight="800" letter-spacing="14" fill="url(#ink)">MINENUMBER</text>
  <text x="644" y="1596" text-anchor="middle" font-family="Geist, Arial, Helvetica, sans-serif"
        font-size="60" font-weight="600" letter-spacing="26" fill="#c084fc" fill-opacity=".75">CARD</text>

  <!-- corner pips -->
  <g fill="url(#ink)" fill-opacity=".55">
    <circle cx="176" cy="176" r="20"/>
    <circle cx="1112" cy="176" r="20"/>
    <circle cx="176" cy="1672" r="20"/>
    <circle cx="1112" cy="1672" r="20"/>
  </g>
</svg>
